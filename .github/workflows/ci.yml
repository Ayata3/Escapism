name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      # TODO: `yarn type-check` は master 時点で 17 件のエラーが出るため未追加。
      # React 18 で `React.FC` が children を暗黙に含まなくなった影響で、
      # 対象ファイルはいずれも Astro 移行で削除されるため、
      # 移行完了時に `astro check` として復活させる。
      - run: yarn build
